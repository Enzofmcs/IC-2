[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enzo-ic2-research"
version = "0.1.0"
description = "Research notebooks and reproducible analysis tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=1.26,<3", "Pillow>=10,<13"]
notebooks = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
